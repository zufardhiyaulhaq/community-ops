name: home-lab-kubernetes-01:master

on:
  push:
    branches:
    - master
    paths:
      - 'clusters/home-lab-kubernetes-01/**'

env:
  KUBECONFIG: /tmp/config
  ISTIO-REVISION: 1-30-4
  ISTIO-VERSION: 1.30.4

jobs:
  kustomize-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        uses: py-actions/py-dependency-install@v2
        with:
          path: "scripts/requirements.txt"
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.3'
      - name: Install kubectl-slice
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          tag: v1.2.4
          repo: patrickdappollonio/kubectl-slice
          platform: linux
          arch: x86_64
      - name: Setup kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
      - name: Setup helmfile
        run: |
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v1.7.4/helmfile_1.7.4_linux_amd64.tar.gz" | tar -xz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          helmfile version
      - name: Setup helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.2.4'
      - name: Setup helm diff plugin
        run: |
          helm plugin install https://github.com/databus23/helm-diff
      - name: Setup Istioctl
        uses: zufardhiyaulhaq/setup-istioctl@v1.0.0
        with:
          version: 1.30.4
      - name: Setup kubeconfig
        run: |
          echo "$HOME_LAB_KUBERNETES_CONFIG" | base64 -d > $KUBECONFIG
        shell: bash
        env:
          HOME_LAB_KUBERNETES_CONFIG: ${{ secrets.HOME_LAB_KUBERNETES_CONFIG }}
      - name: deploy applications
        run: |
          python3 scripts/deployer.py kustomize deploy --cluster-name home-lab-kubernetes-01
  helm-deploy:
    needs:
      - kustomize-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        uses: py-actions/py-dependency-install@v2
        with:
          path: "scripts/requirements.txt"
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.3'
      - name: Install kubectl-slice
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          tag: v1.2.4
          repo: patrickdappollonio/kubectl-slice
          platform: linux
          arch: x86_64
      - name: Setup kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
      - name: Setup helmfile
        run: |
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v1.7.4/helmfile_1.7.4_linux_amd64.tar.gz" | tar -xz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          helmfile version
      - name: Setup helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.2.4'
      - name: Setup helm diff plugin
        run: |
          helm plugin install https://github.com/databus23/helm-diff
      - name: Setup Istioctl
        uses: zufardhiyaulhaq/setup-istioctl@v1.0.0
        with:
          version: 1.30.4
      - name: Setup kubeconfig
        run: |
          echo "$HOME_LAB_KUBERNETES_CONFIG" | base64 -d > $KUBECONFIG
        shell: bash
        env:
          HOME_LAB_KUBERNETES_CONFIG: ${{ secrets.HOME_LAB_KUBERNETES_CONFIG }}
      - name: deploy applications
        run: |
          python3 scripts/deployer.py helm deploy --cluster-name home-lab-kubernetes-01
  manifests-deploy:
    needs:
    - kustomize-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        uses: py-actions/py-dependency-install@v2
        with:
          path: "scripts/requirements.txt"
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.3'
      - name: Install kubectl-slice
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          tag: v1.2.4
          repo: patrickdappollonio/kubectl-slice
          platform: linux
          arch: x86_64
      - name: Setup kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
      - name: Setup helmfile
        run: |
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v1.7.4/helmfile_1.7.4_linux_amd64.tar.gz" | tar -xz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          helmfile version
      - name: Setup helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.2.4'
      - name: Setup helm diff plugin
        run: |
          helm plugin install https://github.com/databus23/helm-diff
      - name: Setup Istioctl
        uses: zufardhiyaulhaq/setup-istioctl@v1.0.0
        with:
          version: 1.30.4
      - name: Setup kubeconfig
        run: |
          echo "$HOME_LAB_KUBERNETES_CONFIG" | base64 -d > $KUBECONFIG
        shell: bash
        env:
          HOME_LAB_KUBERNETES_CONFIG: ${{ secrets.HOME_LAB_KUBERNETES_CONFIG }}
      - name: deploy applications
        run: |
          python3 scripts/deployer.py manifests deploy --cluster-name home-lab-kubernetes-01
  istio-control-plane-deploy:
    needs:
    - helm-deploy
    - manifests-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        uses: py-actions/py-dependency-install@v2
        with:
