name: home-lab-kubernetes-01:pull-request

on:
  pull_request:
    paths:
      - 'clusters/home-lab-kubernetes-01/**'
  
env:
  KUBECONFIG: /tmp/config

jobs:
  kustomize-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        uses: py-actions/py-dependency-install@v2
        with:
          path: "scripts/requirements.txt"
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.3'
      - name: Install kubectl-slice
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          tag: v1.2.4
          repo: patrickdappollonio/kubectl-slice
          platform: linux
          arch: x86_64
      - name: Setup kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
      - name: Setup helmfile
        run: |
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v1.7.4/helmfile_1.7.4_linux_amd64.tar.gz" | tar -xz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          helmfile version
      - name: Setup helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.2.4'
      - name: Setup helm diff plugin
        run: |
          helm plugin install https://github.com/databus23/helm-diff --verify=false
      - name: Resolve istio version and revision from config.yaml
        id: istio
        run: |
          echo "version=$(python3 scripts/deployer.py istio version --cluster-name home-lab-kubernetes-01)" >> "$GITHUB_OUTPUT"
          echo "revision=$(python3 scripts/deployer.py istio revision --cluster-name home-lab-kubernetes-01)" >> "$GITHUB_OUTPUT"
      - name: Setup Istioctl
        uses: zufardhiyaulhaq/setup-istioctl@v1.0.0
        with:
          version: ${{ steps.istio.outputs.version }}
      - name: Setup kubeconfig
        run: |
          echo "$HOME_LAB_KUBERNETES_CONFIG" | base64 -d > $KUBECONFIG
        shell: bash
        env:
          HOME_LAB_KUBERNETES_CONFIG: ${{ secrets.HOME_LAB_KUBERNETES_CONFIG }}
      - name: Diff applications
        run: |
          python3 scripts/deployer.py kustomize diff --cluster-name home-lab-kubernetes-01
