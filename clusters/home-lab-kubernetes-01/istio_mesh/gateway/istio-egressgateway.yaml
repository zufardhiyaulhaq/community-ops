apiVersion: install.istio.io/v1alpha3
kind: IstioOperator
metadata:
  name: istio-egressgateway
  namespace: istio-system
spec:
  hub: gcr.io/istio-release
  profile: empty
  components:
    egressGateways:
    - enabled: true
      name: istio-egressgateway
      label:
        app: istio-egressgateway
        istio: egressgateway
      k8s:
        # Right-sized for the 5-node Pi lab (reference manifest targets a large
        # multi-zone cluster: 3-9 replicas / 2Gi / zone spread). Mirrors the
        # sizing of istio-public-gateway instead.
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: istio-egressgateway
                topologyKey: kubernetes.io/hostname
              weight: 100
        resources:
          requests:
            cpu: 32m
            memory: 32Mi
        podDisruptionBudget:
          maxUnavailable: 1
        hpaSpec:
          maxReplicas: 2
          minReplicas: 1
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        overlays:
        - kind: Deployment
          name: istio-egressgateway
          patches:
          - path: spec.template.spec.containers.[name:istio-proxy].lifecycle
            value:
              preStop:
                exec:
                  command:
                  - /bin/sh
                  - -c
                  - sleep 10
        podAnnotations:
          proxy.istio.io/config: |
            terminationDrainDuration: 30s
          sidecar.istio.io/statsCompression: "zstd"
        service:
          # Egress is in-cluster only.
          type: ClusterIP
          ports:
          - port: 15021
            targetPort: 15021
            name: status-port
          - port: 80
            targetPort: 8080
            name: http2
          - port: 443
            targetPort: 8443
            name: https
          - port: 15443
            targetPort: 15443
            name: tls
