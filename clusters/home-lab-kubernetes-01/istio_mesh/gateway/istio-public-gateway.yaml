apiVersion: install.istio.io/v1alpha3
kind: IstioOperator
metadata:
  name: istio-public-gateway
  namespace: istio-system
spec:
  hub: gcr.io/istio-release
  profile: empty
  components:
    ingressGateways:
    - enabled: true
      name: istio-public-gateway
      label:
        app: istio-public-gateway
      k8s:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: istio-public-gateway
                topologyKey: kubernetes.io/hostname
              weight: 100
        resources:
          requests:
            cpu: 32m
            memory: 32Mi
        priorityClassName: system-cluster-critical
        podDisruptionBudget:
          maxUnavailable: 1
        hpaSpec:
          maxReplicas: 2
          minReplicas: 1
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        overlays:
          - kind: Deployment
            name: istio-public-gateway
            patches:
              - path: spec.template.spec.containers.[name:istio-proxy].lifecycle
                value:
                  preStop:
                    exec:
                      command:
                        - /bin/sh
                        - -c
                        - sleep 10
        podAnnotations:
          proxy.istio.io/config: |
            terminationDrainDuration: 30s
            gatewayTopology:
              numTrustedProxies: 1
              proxyProtocol: {}
            proxyStatsMatcher:
              inclusionPrefixes:
              - istio_proxy_latency_milliseconds
              inclusionRegexps:
                # listeners
                - "^listener.*"
                # http connection manager
                - "^http.*.downstream_cx.*"
                - "^http.*.downstream_rq.*"
                - "^http1.*"
                - "^http2.*"
                - "^http3.*"
                # compressor
                - ".*compressor.*"
                # clusters
                - "^cluster.PassthroughCluster.*upstream_rq.*"
                - "^cluster.InboundPassthroughClusterIpv4.*upstream_rq.*"
                - "^cluster.InboundPassthroughClusterIpv6.*upstream_rq.*"
                - "^cluster.PassthroughCluster.*upstream_cx.*"
                - "^cluster.InboundPassthroughClusterIpv4.*upstream_cx.*"
                - "^cluster.InboundPassthroughClusterIpv6.*upstream_cx.*"
                # control plane
                - "^control_plane.*"
                - "^listener_manager.*"
                - "^cluster_manager.*"
          sidecar.istio.io/statsCompression: "zstd"
          sidecar.istio.io/statsHistogramBuckets: |
            {"istiocustom":[0.5,1,5,10,25,50,100,250,500,1000,1500,2500,3000,5000,10000,11500,30000,60000,300000,600000,3600000]}
        service:
          type: ClusterIP
          ports:
          - port: 443
            targetPort: 8443
            name: https
          - port: 80
            targetPort: 8080
            name: http2
          # TLS passthrough for vcluster API servers (SNI-routed by Gateway/VS).
          # No targetPort remap: the envoy passthrough listener binds 20443 directly.
          - port: 20443
            targetPort: 20443
            name: tls-vcluster
