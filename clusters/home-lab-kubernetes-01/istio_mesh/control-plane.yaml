apiVersion: install.istio.io/v1alpha3
kind: IstioOperator
metadata:
  name: control-plane
  namespace: istio-system
spec:
  hub: ghcr.io/zufardhiyaulhaq/istio-mirror
  profile: minimal
  components:
    pilot:
      enabled: true
      k8s:
        env:
          # METRIC_ROTATION_INTERVAL / METRIC_GRACEFUL_DELETION_INTERVAL were
          # REMOVED in Istio 1.28 (PR #57571) -> dead no-ops on 1.30.x, which is
          # why metrics stopped rotating. Replaced by the mesh-wide
          # sidecar.istio.io/statsEvictionInterval injectedAnnotation (see
          # values.sidecarInjectorWebhook below).
          - name: PILOT_DEBOUNCE_AFTER
            value: "500ms"
          - name: PILOT_DEBOUNCE_MAX
            value: "2s"
          - name: PILOT_ENABLE_EDS_DEBOUNCE
            value: "true"
          - name: ENABLE_NATIVE_SIDECARS
            value: "true"
          - name: PILOT_ENABLE_IP_AUTOALLOCATE
            value: "true"
        serviceAnnotations:
          service.kubernetes.io/topology-aware-hints: auto
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: istiod
                    istio: pilot
                topologyKey: kubernetes.io/hostname
              weight: 100
        resources:
          requests:
            cpu: 70m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        priorityClassName: system-cluster-critical
        podDisruptionBudget:
          minAvailable: 1
        hpaSpec:
          maxReplicas: 2
          minReplicas: 1
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
  meshConfig:
    tlsDefaults:
      ecdhCurves:
      - X25519MLKEM768
      - X25519
      - P-256
    tcpKeepalive:
      time: 60s
      probes: 3
      interval: 60s
    accessLogFile: /dev/stdout
    accessLogEncoding: JSON
    accessLogFormat: |
      {
        "protocol": "%PROTOCOL%",
        "duration": "%DURATION%",
        "route_name": "%ROUTE_NAME%",
        "user_agent": "%REQ(USER-AGENT)%",
        "response_code": "%RESPONSE_CODE%",
        "response_flags": "%RESPONSE_FLAGS%",
        "response_flags_long": "%RESPONSE_FLAGS_LONG%",
        "start_time": "%START_TIME%",
        "request_duration": "%REQUEST_DURATION%",
        "response_duration": "%RESPONSE_DURATION%",
        "response_tx_duration": "%RESPONSE_TX_DURATION%",
        "downstream_tls_handshake_ms": "%COMMON_DURATION(DS_HS_BEG:DS_HS_END:ms)%",
        "upstream_connect_ms": "%COMMON_DURATION(US_CX_BEG:US_CX_END:ms)%",
        "upstream_pool_ready_duration": "%UPSTREAM_CONNECTION_POOL_READY_DURATION%",
        "method": "%REQ(:METHOD)%",
        "request_id": "%REQ(X-REQUEST-ID)%",
        "trace_id": "%TRACE_ID%",
        "connection_id": "%CONNECTION_ID%",
        "x_forwarded_for": "%REQ(X-FORWARDED-FOR)%",
        "x_forwarded_host": "%REQ(X-FORWARDED-HOST)%",
        "requested_server_name": "%REQUESTED_SERVER_NAME%",
        "bytes_received": "%BYTES_RECEIVED%",
        "bytes_sent": "%BYTES_SENT%",
        "authority": "%REQ(:AUTHORITY)%",
        "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%",
        "response_code_details": "%RESPONSE_CODE_DETAILS%",
        "connection_termination_details": "%CONNECTION_TERMINATION_DETAILS%",
        "grpc_status_code": "%GRPC_STATUS_NUMBER%",
        "downstream_tls_version": "%DOWNSTREAM_TLS_VERSION%",
        "downstream_tls_session_id": "%DOWNSTREAM_TLS_SESSION_ID%",
        "downstream_tls_cipher": "%DOWNSTREAM_TLS_CIPHER%",
        "tls_ja4_fingerprint": "%TLS_JA4_FINGERPRINT%",
        "downstream_peer_certificate_validity_start": "%DOWNSTREAM_PEER_CERT_V_START%",
        "downstream_peer_certificate_validity_end": "%DOWNSTREAM_PEER_CERT_V_END%",
        "downstream_peer_uri_san": "%DOWNSTREAM_PEER_URI_SAN%",
        "downstream_peer_issuer": "%DOWNSTREAM_PEER_ISSUER%",
        "downstream_peer_subject": "%DOWNSTREAM_PEER_SUBJECT%",
        "downstream_local_address": "%DOWNSTREAM_LOCAL_ADDRESS%",
        "downstream_remote_address": "%DOWNSTREAM_REMOTE_ADDRESS%",
        "downstream_remote_address_without_port": "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%",
        "downstream_direct_remote_address": "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS%",
        "downstream_detected_close_type": "%DOWNSTREAM_DETECTED_CLOSE_TYPE%",
        "downstream_local_close_reason": "%DOWNSTREAM_LOCAL_CLOSE_REASON%",
        "upstream_service_time": "%RESP(x-envoy-upstream-service-time)%",
        "upstream_local_address": "%UPSTREAM_LOCAL_ADDRESS%",
        "upstream_remote_address": "%UPSTREAM_REMOTE_ADDRESS%",
        "upstream_transport_failure_reason": "%UPSTREAM_TRANSPORT_FAILURE_REASON%",
        "upstream_protocol": "%UPSTREAM_PROTOCOL%",
        "upstream_peer_subject": "%UPSTREAM_PEER_SUBJECT%",
        "upstream_peer_issuer": "%UPSTREAM_PEER_ISSUER%",
        "upstream_tls_version": "%UPSTREAM_TLS_VERSION%",
        "upstream_peer_certificate_validity_end": "%UPSTREAM_PEER_CERT_V_END%",
        "upstream_host": "%UPSTREAM_HOST%",
        "upstream_cluster": "%UPSTREAM_CLUSTER%",
        "upstream_request_attempt_count": "%UPSTREAM_REQUEST_ATTEMPT_COUNT%",
        "upstream_hosts_attempted": "%UPSTREAM_HOSTS_ATTEMPTED%",
        "upstream_connection_id": "%UPSTREAM_CONNECTION_ID%",
        "upstream_detected_close_type": "%UPSTREAM_DETECTED_CLOSE_TYPE%",
        "upstream_local_close_reason": "%UPSTREAM_LOCAL_CLOSE_REASON%",
        "upstream_header_bytes_sent": "%UPSTREAM_HEADER_BYTES_SENT%",
        "upstream_header_bytes_received": "%UPSTREAM_HEADER_BYTES_RECEIVED%",
        "request_headers_bytes": "%REQUEST_HEADERS_BYTES%",
        "response_headers_bytes": "%RESPONSE_HEADERS_BYTES%",
        "downstream_header_bytes_received": "%DOWNSTREAM_HEADER_BYTES_RECEIVED%"
      }
    dnsRefreshRate: 240s
    defaultConfig:
      tracingServiceName: APP_LABEL_AND_NAMESPACE
      terminationDrainDuration: 10s
      holdApplicationUntilProxyStarts: true
      proxyMetadata:
        ISTIO_META_DNS_CAPTURE: "true"
        BOOTSTRAP_XDS_AGENT: "true"
    discoverySelectors:
      - matchExpressions:
          - key: istio-discovery
            operator: NotIn
            values:
              - disabled
  values:
    global:
      proxy:
        resources:
          requests:
            memory: 128Mi
            cpu: 32m
          limits:
            memory: 512Mi
    sidecarInjectorWebhook:
      # Mesh-wide replacement for the removed metric rotation. Every sidecar
      # injected by this revision gets this annotation, which the istio-agent
      # reads at BOOTSTRAP from the pod metadata and uses to evict stale Envoy
      # stats every 120s (matches the old 2m rotation). Value must be a multiple
      # of the stats flush interval. Takes effect on pod (re)injection -> roll
      # workloads to apply.
      injectedAnnotations:
        sidecar.istio.io/statsEvictionInterval: "120s"
