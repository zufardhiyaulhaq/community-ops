apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fastgateway-dev-cluster-issuer
spec:
  acme:
    email: admin@fastgateway.dev
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: fastgateway-dev-cluster-issuer-secret
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-dns
            key: cloudflare_api_token
