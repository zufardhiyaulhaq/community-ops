apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kato-bot
  namespace: argocd-system
spec:
  project: default
  source:
    repoURL: https://gopaytech.github.io/kato-bot/charts/releases/
    chart: kato-bot
    targetRevision: 0.6.0
    helm:
      releaseName: kato-bot
      valuesObject:
        # Pin the v-prefixed image tag (chart default "0.6.0" 404s; the
        # published image is "v0.6.0", arm64+amd64).
        image:
          tag: v0.6.0
        # Telegram-only chat adapter. Long-poll getUpdates -> no ingress.
        telegram:
          enabled: true
          # Secret kato-bot-telegram (SealedSecret) holds TELEGRAM_BOT_TOKEN.
          existingSecret: kato-bot-telegram
          # Only this Telegram user may trigger the bot.
          allowedUsers:
          - "360050991"
        # In-cluster kato REST endpoint the bot submits runs to.
        clusters:
        - name: home-lab
          url: http://kato.kato-system.svc:8080
  destination:
    server: https://kubernetes.default.svc
    namespace: kato-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
