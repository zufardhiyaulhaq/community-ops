apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: notes.zufardhiyaulhaq.com
  namespace: istio-system
spec:
  endpoints:
  # GitHub Pages for github.com/zufardhiyaulhaq/notes (MkDocs site).
  # Subdomain -> CNAME to the user's Pages domain (unproxied); the repo's
  # docs/CNAME sets the custom domain on the Pages side.
  - dnsName: notes.zufardhiyaulhaq.com
    recordType: CNAME
    recordTTL: 300
    targets:
    - zufardhiyaulhaq.github.io
