apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-mtls-test-zufardhiyaulhaq-com-gateway
  namespace: istio-system
spec:
  selector:
    app: istio-public-gateway
  servers:
  - hosts:
    - "istio-mtls-test.zufardhiyaulhaq.com"
    port:
      name: http
      number: 80
      protocol: HTTP
    tls:
      httpsRedirect: true
  - hosts:
    - "istio-mtls-test.zufardhiyaulhaq.com"
    port:
      name: https
      number: 443
      protocol: HTTPS
    tls:
      # istio mutual TLS: gateway uses istio's mesh-issued certs and requires the
      # downstream to present istio mTLS. No credentialName / cert-manager cert.
      mode: ISTIO_MUTUAL
