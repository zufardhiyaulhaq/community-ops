apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: mtls-test-zufardhiyaulhaq-com-gateway
  namespace: istio-system
spec:
  selector:
    app: istio-public-gateway
  servers:
  - hosts:
    - "mtls-test.zufardhiyaulhaq.com"
    port:
      name: http
      number: 80
      protocol: HTTP
    tls:
      httpsRedirect: true
  - hosts:
    - "mtls-test.zufardhiyaulhaq.com"
    port:
      name: https
      number: 443
      protocol: HTTPS
    tls:
      minProtocolVersion: TLSV1_3
      # MUTUAL: server presents the LE cert AND requires a client cert.
      # Client cert is validated against the CA in the <credentialName>-cacert
      # secret, and restricted to the mtls-test-client SAN.
      mode: MUTUAL
      credentialName: mtls-test-zufardhiyaulhaq-com-cert
      subjectAltNames:
      - "mtls-test-client.zufardhiyaulhaq.com"
