apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: test-zufardhiyaulhaq-com-vs
  namespace: istio-system
spec:
  hosts:
  - "test.zufardhiyaulhaq.com"
  gateways:
  - istio-system/test-zufardhiyaulhaq-com-gateway
  http:
  - name: "default-route"
    match:
    - uri:
        prefix: /
    route:
      - destination:
          port:
            number: 9898
          host: podinfo.bookinfo.svc.cluster.local
  exportTo:
    - "."
