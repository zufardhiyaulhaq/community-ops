apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: test-vcluster-01-kubernetes-zufardhiyaulhaq-com-gateway
  namespace: istio-system
spec:
  selector:
    app: istio-public-gateway
  servers:
  # TLS passthrough on a dedicated port: istio reads SNI only and forwards the
  # raw TLS stream to the vcluster, which terminates mTLS with the client cert.
  # Host-scoped: this gateway matches only this one vcluster domain.
  - hosts:
    - "test-vcluster-01.kubernetes.zufardhiyaulhaq.com"
    port:
      name: tls-vcluster
      number: 20443
      protocol: TLS
    tls:
      mode: PASSTHROUGH
