apiVersion: frp.zufardhiyaulhaq.com/v1alpha1
kind: Upstream
metadata:
  name: istio-gateway-https
  namespace: infrastructure
spec:
  client: istio-gateway
  tcp:
    host: istio-public-gateway.istio-system.svc.cluster.local
    port: 443
    server:
      port: 443
    proxyProtocol: v2
    transport:
      useEncryption: true
      useCompression: true
