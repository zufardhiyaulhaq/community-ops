# Demo vcluster reaper: deletes the demo-vcluster-01 namespace every hour, then
# force-refreshes the demo-vcluster-01 ArgoCD Application so selfHeal rebuilds
# the vcluster immediately instead of waiting up to ArgoCD's ~180s reconcile.
# experimental.deploy then re-bootstraps the whole stack clean. Net effect: all
# visitor state (which lives INSIDE the vcluster, untracked by Argo) is wiped on
# a fixed hourly wall-clock cycle. Boot + bootstrap takes ~10-15 min, so an
# hourly cycle leaves ~45 min usable.
#
# Lives in infrastructure (stable); it cannot live in demo-vcluster-01, which is
# the namespace it deletes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-vcluster-reaper
  namespace: infrastructure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-vcluster-reaper
rules:
# Scoped to only the demo namespace: get (to check) + delete. Namespaces are
# cluster-scoped, so this must be a ClusterRole; resourceNames limits the blast
# radius to demo-vcluster-01 alone.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "delete"]
  resourceNames: ["demo-vcluster-01"]
# Force-refresh the one demo Application (annotate = get + patch) so Argo
# reconciles it immediately after the namespace is gone. Scoped to the single
# app name; no access to any other Application.
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "patch"]
  resourceNames: ["demo-vcluster-01"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-vcluster-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-vcluster-reaper
subjects:
- kind: ServiceAccount
  name: demo-vcluster-reaper
  namespace: infrastructure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-vcluster-reaper
  namespace: infrastructure
spec:
  schedule: "0 * * * *"
  # Never overlap a reap with the previous one.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Deleting the namespace waits for finalizers (~3-4 min), then the refresh
      # runs; give the whole Job room before it is treated as stuck.
      activeDeadlineSeconds: 420
      template:
        metadata:
          annotations:
            # No sidecar, or the Job pod never completes.
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: demo-vcluster-reaper
          restartPolicy: Never
          # Two distroless kubectl steps (no shell needed). The init container
          # deletes the namespace and WAITS for it to fully terminate; only then
          # does the main container force-refresh the Application, so Argo
          # rebuilds right away rather than waiting for its next reconcile. If the
          # namespace is slow to finalize past the timeout, the Job fails and the
          # next hourly run retries (Argo still rebuilds on its own meanwhile).
          # In-cluster config comes from the mounted ServiceAccount token.
          initContainers:
          - name: delete-namespace
            image: registry.k8s.io/kubectl:v1.33.4
            command: ["kubectl"]
            args:
            - delete
            - namespace
            - demo-vcluster-01
            - --ignore-not-found
            - --wait=true
            - --timeout=360s
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
          containers:
          - name: force-refresh
            image: registry.k8s.io/kubectl:v1.33.4
            command: ["kubectl"]
            args:
            - annotate
            - application
            - demo-vcluster-01
            - -n
            - argocd-system
            - argocd.argoproj.io/refresh=hard
            - --overwrite
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
