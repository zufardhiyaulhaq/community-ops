# Demo vcluster reaper: deletes the demo-vcluster-01 namespace every hour.
# ArgoCD selfHeal (the demo-vcluster-01 Application has automated prune+selfHeal)
# then rebuilds the vcluster, and the demo-vcluster-sync-nudge CronJob (:04-:08)
# triggers an explicit sync to force the apply. experimental.deploy re-bootstraps
# the whole stack clean. Net effect: all visitor state (which lives INSIDE the
# vcluster, untracked by Argo) is wiped on a fixed hourly wall-clock cycle. Boot
# + bootstrap takes ~10-15 min, so an hourly cycle leaves ~45 min usable.
#
# Lives in infrastructure (stable); it cannot live in demo-vcluster-01, which is
# the namespace it deletes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-vcluster-reaper
  namespace: infrastructure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-vcluster-reaper
rules:
# Scoped to only the demo namespace: get + delete. Namespaces are cluster-scoped
# so this must be a ClusterRole; resourceNames limits the blast radius to
# demo-vcluster-01 alone. The delete uses --wait=false precisely because a
# waiting delete needs list/watch on namespaces, which resourceNames cannot grant.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "delete"]
  resourceNames: ["demo-vcluster-01"]
# Used by the demo-vcluster-sync-nudge CronJob (same ServiceAccount) to patch the
# one demo Application's .operation and trigger a sync. Scoped to the single app
# name; no access to any other Application.
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "patch"]
  resourceNames: ["demo-vcluster-01"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-vcluster-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-vcluster-reaper
subjects:
- kind: ServiceAccount
  name: demo-vcluster-reaper
  namespace: infrastructure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-vcluster-reaper
  namespace: infrastructure
spec:
  schedule: "0 * * * *"
  # Never overlap a reap with the previous one.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # The reap is a single fast API call; don't let a stuck run linger.
      activeDeadlineSeconds: 120
      template:
        metadata:
          annotations:
            # No sidecar, or the Job pod never completes.
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: demo-vcluster-reaper
          restartPolicy: Never
          containers:
          - name: reaper
            image: registry.k8s.io/kubectl:v1.33.4
            # Distroless image (no shell): invoke kubectl directly. In-cluster
            # config from the mounted ServiceAccount token. --wait=false so we
            # don't block on finalizers -- and a waiting delete would need
            # list/watch on namespaces, which the resourceNames-scoped RBAC
            # cannot grant. selfHeal + the sync-nudge CronJob rebuild afterwards.
            command: ["kubectl"]
            args:
            - delete
            - namespace
            - demo-vcluster-01
            - --ignore-not-found
            - --wait=false
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
