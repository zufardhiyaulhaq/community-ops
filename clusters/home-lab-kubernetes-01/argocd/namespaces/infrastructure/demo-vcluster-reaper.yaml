# Demo vcluster reaper: wipes the demo-vcluster-01 vcluster every hour.
#
# It does NOT delete the namespace. Re-creating a deleted namespace depended on
# ArgoCD's CreateNamespace, and ArgoCD's cluster cache kept missing the delete,
# so the demo stayed down for hours or days. Now the namespace, the StatefulSet
# and every ArgoCD-managed object stay in place, and only the vcluster's data is
# reset:
#   1. delete the PVC data-demo-vcluster-01-0 (the vcluster's whole database)
#   2. delete the pod demo-vcluster-01-0, repeating until the old PVC is gone
#      (the PVC cannot finish deleting while a pod still uses it)
#   3. the StatefulSet controller (not ArgoCD) recreates the pod with a fresh,
#      empty PVC; the vcluster boots empty, removes the old synced host objects,
#      and experimental.deploy installs the demo stack again.
# Net effect: all visitor state inside the vcluster is wiped on a fixed hourly
# cycle. Boot + bootstrap takes ~10-15 min, so ~45 min per hour is usable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-vcluster-reaper
  namespace: infrastructure
---
# Reset permissions, only inside demo-vcluster-01 and only for the vcluster's
# own pod and PVC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-vcluster-reaper
  namespace: demo-vcluster-01
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "delete"]
  resourceNames: ["demo-vcluster-01-0"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "delete"]
  resourceNames: ["data-demo-vcluster-01-0"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-vcluster-reaper
  namespace: demo-vcluster-01
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-vcluster-reaper
subjects:
- kind: ServiceAccount
  name: demo-vcluster-reaper
  namespace: infrastructure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-vcluster-reaper
rules:
# Used by the demo-vcluster-sync-nudge CronJob (same ServiceAccount): read the
# demo namespace, and patch the one demo Application's .operation to trigger a
# sync. Both scoped to the single name.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
  resourceNames: ["demo-vcluster-01"]
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "patch"]
  resourceNames: ["demo-vcluster-01"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-vcluster-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-vcluster-reaper
subjects:
- kind: ServiceAccount
  name: demo-vcluster-reaper
  namespace: infrastructure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-vcluster-reaper
  namespace: infrastructure
spec:
  schedule: "0 * * * *"
  # Never overlap a reset with the previous one.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          annotations:
            # No sidecar, or the Job pod never completes.
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: demo-vcluster-reaper
          restartPolicy: Never
          containers:
          - name: reaper
            # Needs a shell for the loop (registry.k8s.io/kubectl is distroless).
            image: alpine/k8s:1.33.4
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -u
              NS=demo-vcluster-01
              PVC=data-demo-vcluster-01-0
              POD=demo-vcluster-01-0
              old=$(kubectl -n "$NS" get pvc "$PVC" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
              if [ -z "$old" ]; then
                echo "no PVC $PVC, nothing to reset"; exit 0
              fi
              echo "resetting vcluster: deleting PVC $PVC ($old)"
              kubectl -n "$NS" delete pvc "$PVC" --wait=false
              # The StatefulSet recreates the pod at once, which would keep the old
              # PVC in use. Keep deleting the pod until the old PVC is gone (the
              # StatefulSet then creates a new PVC under the same name, new UID).
              i=0
              while [ $i -lt 60 ]; do
                i=$((i+1))
                kubectl -n "$NS" delete pod "$POD" --wait=false --ignore-not-found >/dev/null
                cur=$(kubectl -n "$NS" get pvc "$PVC" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
                if [ "$cur" != "$old" ]; then
                  echo "old PVC gone after $i round(s)"; break
                fi
                sleep 3
              done
              if [ "$cur" = "$old" ]; then
                echo "old PVC still present after $i rounds"; exit 1
              fi
              # A pod created while the old PVC was terminating cannot start;
              # replace it once more so it binds the fresh PVC.
              sleep 3
              kubectl -n "$NS" delete pod "$POD" --wait=false --ignore-not-found
              echo "reset done"
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
