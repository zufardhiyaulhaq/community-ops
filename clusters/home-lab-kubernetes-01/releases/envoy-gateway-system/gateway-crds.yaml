# Envoy Gateway CRDs bundle (gateway-crds-helm) v1.8.4.
# Installs the Gateway API v1.5.1 CRDs (standard channel) + the Envoy Gateway
# CRDs as a dedicated, upgradable release.
crds:
  gatewayAPI:
    enabled: true
    # standard = GA + beta resources (Gateway, HTTPRoute, GRPCRoute, ...).
    # Use "experimental" only if you need TCPRoute/TLSRoute/UDPRoute/BackendTLSPolicy.
    channel: standard
  envoyGateway:
    enabled: true
