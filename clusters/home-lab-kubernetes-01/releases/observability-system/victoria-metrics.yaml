fullnameOverride: "o11y"

# single-node TSDB — was vmcluster (6 vmstorage + 3 vmselect + 2 vminsert). Pi-sized.
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "1"
    storage:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
    resources:
      requests:
        cpu: 128m
        memory: 512Mi
vmcluster:
  enabled: false

vmalert:
  enabled: true
vmagent:
  enabled: true

alertmanager:
  enabled: true
  resources:
    requests:
      cpu: 64m
      memory: 64Mi

grafana:
  enabled: true
  resources:
    requests:
      cpu: 64m
      memory: 128Mi
  useStatefulSet: true
  persistence:
    type: statefulset
    enabled: true
    size: 2Gi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 64m
      memory: 64Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 32m
      memory: 96Mi

coreDns:
  enabled: true
kubelet:
  enabled: true
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: false
kubeDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
