fullnameOverride: "o11y"

# single-node TSDB
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "1"
    storage:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
    resources:
      requests:
        cpu: 128m
        memory: 512Mi
vmcluster:
  enabled: false

vmalert:
  enabled: true
vmagent:
  enabled: true
  # Tag every scraped metric with the Kubernetes cluster name so dashboards/
  # alerts can filter by cluster (the "Cluster" dropdown in Grafana).
  # Uses cluster_name (not cluster) to avoid colliding with CloudNativePG's
  # own `cluster` metric label (which names the Postgres cluster).
  # Additive: existing queries that ignore the label are unaffected.
  spec:
    externalLabels:
      cluster_name: home-lab-kubernetes-01

alertmanager:
  enabled: true
  resources:
    requests:
      cpu: 64m
      memory: 64Mi

grafana:
  enabled: true
  resources:
    requests:
      cpu: 64m
      memory: 128Mi
  useStatefulSet: true
  persistence:
    type: statefulset
    enabled: true
    size: 2Gi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 64m
      memory: 64Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 32m
      memory: 96Mi

coreDns:
  enabled: true
kubelet:
  enabled: true
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: false
kubeDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
