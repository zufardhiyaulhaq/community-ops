crds:
  install: true

server:
  extraArgs:
  - --insecure
  resources:
    requests:
      cpu: 32m
      memory: 64Mi

redis:
  resources:
    requests:
      cpu: 16m
      memory: 32Mi

repoServer:
  resources:
    requests:
      cpu: 32m
      memory: 64Mi

controller:
  resources:
    requests:
      cpu: 32m
      memory: 64Mi

applicationset:
  resources:
    requests:
      cpu: 32m
      memory: 64Mi

notifications:
  resources:
    requests:
      cpu: 16m
      memory: 32Mi

configs:
  resources:
    requests:
      cpu: 32m
      memory: 64Mi
  # Register the Envoy Gateway OCI Helm registry so the envoy-gateway-crds
  # Application can pull oci://docker.io/envoyproxy/gateway-crds-helm. Public,
  # anonymous pull -> no credentials.
  repositories:
    envoyproxy:
      url: docker.io/envoyproxy
      name: envoyproxy
      type: helm
      enableOCI: "true"
